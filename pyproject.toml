[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silentwatch"
version = "0.0.1"
description = "Privacy-first Windows laptop presence, camera-tamper and anti-theft protection"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
silentwatch = ["config/default.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
